<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Basic -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />

    <!-- Title (VERY IMPORTANT) -->
    <title>Irshad Ahmed | Full-Stack Web Developer</title>

    <!-- SEO Meta -->
    <meta
      name="description"
      content="Irshad Ahmed is a Full-Stack Web Developer specializing in React, Next.js, Node.js, PostgreSQL, and Prisma. Experienced in building scalable, secure, and modern web applications."
    />
    <meta name="author" content="Irshad Ahmed" />
    <meta
      name="keywords"
      content="Irshad Ahmed, Full Stack Developer, React Developer, Next.js Developer, Node.js Developer, Web Developer Portfolio, JavaScript Developer"
    />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://irshad-folio-zone.vercel.app/" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Open Graph (LinkedIn, WhatsApp, Facebook) -->
    <meta
      property="og:title"
      content="Irshad Ahmed | Full-Stack Web Developer"
    />
    <meta
      property="og:description"
      content="Full-Stack Web Developer with real-world experience in Next.js, React, Node.js, PostgreSQL, Prisma, and AWS. View projects and portfolio."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://irshad-folio-zone.vercel.app/" />
    <meta
      property="og:image"
      content="https://irshad-folio-zone.vercel.app/og-image.png"
    />
    <meta
      name="twitter:image"
      content="https://irshad-folio-zone.vercel.app/og-image.png"
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Irshad Ahmed | Full-Stack Web Developer"
    />
    <meta
      name="twitter:description"
      content="Portfolio of Irshad Ahmed – Full-Stack Web Developer specializing in modern web technologies."
    />
    <!-- <meta name="twitter:image" content="https://irshad-folio-zone.vercel.app/og-image.png" /> -->

    <!-- JSON-LD Structured Data (VERY POWERFUL FOR SEO) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Irshad Ahmed",
        "url": "https://irshad-folio-zone.vercel.app/",
        "jobTitle": "Full Stack Web Developer",
        "sameAs": [
          "https://www.linkedin.com/in/irshad-ahmed-06103710a/",
          "https://github.com/Irshad117",
          "https://x.com/IrshadGhoto"
        ],
        "knowsAbout": [
          "React",
          "Next.js",
          "Node.js",
          "PostgreSQL",
          "Prisma",
          "AWS",
          "JavaScript",
          "TypeScript"
        ]
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
